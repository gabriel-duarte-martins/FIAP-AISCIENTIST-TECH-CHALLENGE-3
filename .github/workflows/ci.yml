name: Contrato de modelagem
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.0.2 pandas==2.2.2 scikit-learn==1.6.1
      - run: python verify_project.py
